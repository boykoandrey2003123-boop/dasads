# ===== BuildBattle Config =====

lobby-world: "world"
lobby-x: 0.5
lobby-y: 100.0
lobby-z: 0.5

# Время постройки (сек)
build-time-seconds: 300
# Время показа одной постройки во время оценивания (сек)
voting-time-per-plot-seconds: 20
# Через сколько секунд начинать игру принудительно, если не набралось макс. игроков (0 = отключено)
force-start-seconds: 60
# Минимум команд/игроков для старта
min-teams: 2

# Темы построек (на русском). Тема выбирается случайно для каждой игры.
themes:
  - "Подводный дворец"
  - "Средневековый замок"
  - "Дом на дереве"
  - "Космическая станция"
  - "Пиратский корабль"
  - "Зимняя деревня"
  - "Храм джунглей"
  - "Футуристический город"
  - "Ферма мечты"
  - "Логово дракона"
  - "Волшебный лес"
  - "Заброшенная шахта"
  - "Плавучий остров"
  - "Древние руины"
  - "Кузница гномов"
  - "Хижина ведьмы"
  - "Ледяная крепость"
  - "Вулканическая база"
  - "Пустынный оазис"
  - "Библиотека магии"

# Блоки, доступные в GUI выбора блока для заливки площадки
fill-blocks:
  - STONE
  - OAK_PLANKS
  - WHITE_WOOL
  - GLASS
  - SAND
  - GRASS_BLOCK
  - QUARTZ_BLOCK
  - BRICKS
  - COBBLESTONE
  - AIR

# Очки за оценки
ratings:
  FIGNYA: { name: "Фигня", points: 1 }
  PLOHO: { name: "Плохо", points: 2 }
  NEPLOHO: { name: "Неплохо", points: 3 }
  NORM: { name: "Норм", points: 4 }
  HOROSHO: { name: "Хорошо", points: 5 }
  OTLICHNO: { name: "Отлично", points: 6 }
  BOZHESTVENNO: { name: "Божественно", points: 7 }
